<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Eduardo Caversan — Software Engineer</title>
  <desc id="desc">A dark engineering dashboard banner with cyan and violet accents.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090D14"/>
      <stop offset="0.52" stop-color="#0D1625"/>
      <stop offset="1" stop-color="#100C21"/>
    </linearGradient>
    <linearGradient id="line" x1="246" y1="0" x2="954" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00D9FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00D9FF"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#7DD3FC" stroke-opacity="0.075" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" rx="18" fill="url(#background)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <path d="M0 58H180L210 88H390" stroke="#00D9FF" stroke-opacity="0.3"/>
  <path d="M810 232H990L1020 202H1200" stroke="#8B5CF6" stroke-opacity="0.35"/>
  <circle cx="210" cy="88" r="3" fill="#00D9FF" filter="url(#glow)"/>
  <circle cx="1020" cy="202" r="3" fill="#8B5CF6" filter="url(#glow)"/>
  <rect x="246" y="65" width="708" height="1" fill="url(#line)"/>
  <g fill="#00D9FF" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" letter-spacing="3">
    <text x="600" y="112" text-anchor="middle">// SYSTEM ONLINE · ENGINEERING MODE</text>
  </g>
  <text x="600" y="179" text-anchor="middle" fill="#F0F6FC" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" letter-spacing="5">EDUARDO CAVERSAN</text>
  <text x="600" y="217" text-anchor="middle" fill="#B8C5D6" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="17" letter-spacing="2">SOFTWARE ENGINEER</text>
  <g fill="#8B5CF6" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" letter-spacing="2">
    <text x="600" y="262" text-anchor="middle">BUILD · SHIP · OBSERVE · IMPROVE</text>
  </g>
  <rect x="246" y="280" width="708" height="1" fill="url(#line)"/>
</svg>
